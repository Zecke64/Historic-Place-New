<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>historic.place</title>

    <link rel="stylesheet" href="css/splash-win.css">
    <script type="module" src="js/language.js"> </script>
</head>

<body>

    <div class="splash-links">
        <a id="wiki_link" href="https://wiki.historic.place/doku.php?id=start"
           data-i18n="splash.wiki"
        </a>

        <a href="https://www.historic.place/themes/sonderkarten/Maplibre/historic.html"
           data-i18n="splash.specialmaps" target="_top"></a>

        <a href="https://wiki.historic.place/doku.php?id=spenden"
           data-i18n="splash.donate"></a>

        <a href="https://gk.historic.place/Anbieterkennung.html"
           data-i18n="splash.contact"></a>

        <a href="https://wiki.historic.place/doku.php?id=de:news"
           data-i18n="splash.news"></a>

        <a href="https://wiki.historic.place/doku.php?id=de:karteneigenschaften"
           data-i18n="splash.legend"></a>
    </div>

    <div class="splash-update">
        <span data-i18n="splash.latestUpdate"></span>
        <time id="update-date">18.10.2026</time>
    </div>

    <script>
        const language = new URLSearchParams(window.location.search).get("lang");
        fetch('update.date.txt')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP-Error: ${response.status}`);
                }
                return response.text();
            })
            .then(text => {
                const timestamp = text.trim();
                const date = new Date(timestamp);

                if (Number.isNaN(date.getTime())) {
                    throw new Error(`Ungültiger Zeitstempel: "${timestamp}"`);
                }

                const formatted = new Intl.DateTimeFormat(language, {
                    dateStyle: 'medium',
                    timeZone: 'UTC'
                }).format(date);
                document.getElementById('update-date').textContent = formatted;
            })
            .catch(error => {
                document.getElementById('update-date').textContent = 'not available';
                console.error('Fehler beim Laden des Datums:', error);
            });
    </script>

    <script type="module">
        import {tr,setLanguage} from "./js/language.js";

        function updateSplashLanguage() {
            document
                .querySelectorAll("[data-i18n]")
                .forEach(element => {
                    element.textContent = tr(element.dataset.i18n);
                    if (element.dataset.i18n === "splash.wiki") {
                        element.href = tr("splash.wiki_url");
                    }
                });
        }

        const language = new URLSearchParams(window.location.search).get("lang");

        if (language) {
            setLanguage(language);
        }
        updateSplashLanguage();

        window.addEventListener(
            "languagechange",
            updateSplashLanguage
        );
    </script>

</body>

</html>
